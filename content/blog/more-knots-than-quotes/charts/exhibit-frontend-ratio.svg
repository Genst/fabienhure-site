<svg xmlns="http://www.w3.org/2000/svg" class="viz-root" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Front-end tail error ratio, smooth bootstrap over underdetermined fit, by window and currency">

<style>
.viz-root, [data-theme="light"] .viz-root { color-scheme: light;
  --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --band: #f0efec;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; }
@media (prefers-color-scheme: dark) { .viz-root { color-scheme: dark;
  --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --band: #232322;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; } }
/* Inlined in a page, the site's theme toggle (html[data-theme]) overrides the OS preference. */
[data-theme="dark"] .viz-root { color-scheme: dark;
  --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --band: #232322;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; }
.viz-root text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-title { font-size: 15px; font-weight: 600; fill: var(--text-primary); }
.t-sub { font-size: 12.5px; fill: var(--text-secondary); }
.t-panel { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
.t-axis { font-size: 11.5px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.t-cat { font-size: 12px; fill: var(--text-secondary); }
.t-cat2 { font-size: 11px; fill: var(--text-muted); }
.t-legend { font-size: 12.5px; fill: var(--text-secondary); }
.t-value { font-size: 11px; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
.t-note { font-size: 11.5px; fill: var(--text-muted); }
.grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
</style>

<rect width="760" height="400" fill="var(--surface-1)"/>
<text class="t-title" x="16" y="26">On the front end, the gap is largest when scheduled decisions are repriced</text>
<text class="t-sub" x="16" y="45">Front end (2W to 2Y): smooth bootstrap 90th-percentile error divided by the underdetermined fit's. 1 means level.</text>
